<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Rotator</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }

        #image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 16px;
        }

        button {
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <img id="image" src="https://picsum.photos/300" alt="Rotate Me">

    <div class="buttons">
        <button onclick="rotate(-90)">⟵ Left</button>
        <button onclick="rotate(90)">Right ⟶</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
